name: "2026102501: OpenSSL pc"

on:
  workflow_dispatch:

jobs:
  a:
    runs-on: ubuntu-26.04
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          echo "Dynamic:"
          pkg-config --libs libssl
          echo "Static:"
          pkg-config --libs --static libssl
  b:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          echo "Dynamic:"
          pkg-config --libs libssl
          echo "Static:"
          pkg-config --libs --static libssl
